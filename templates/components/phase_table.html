<!-- Phase Information Table -->
<div id="phase-info" class="phase-info-container">
  <div class="phase-info-header">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 5h18v14H3z"/><path d="M3 10h18"/><path d="M9 5v14"/>
    </svg>
    <h2>Phase Information</h2>
    <span id="phase-count"></span>
  </div>
  <div class="phase-info-content">
    <div id="phase-summary" class="phase-summary"></div>
    <div class="table-scroll">
      <table id="phase-table" class="phase-table">
        <thead>
          <tr>
            <th scope="col">Formula</th>
            <th scope="col">Composition</th>
            <th scope="col">Formation Energy<br><small>(eV/atom)</small></th>
            <th scope="col">Total Energy<br><small>(eV/atom)</small></th>
            <th scope="col">Correction<br><small>(eV)</small>
              <span class="info-icon" role="img" tabindex="0"
                    aria-label="Energy correction for DFT systematic errors. Zero means no correction was applied."
                    title="Energy correction for DFT systematic errors. Zero means no correction was applied.">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z"/><path d="M12 16v-4"/><path d="M12 8h.01"/>
                </svg>
              </span>
            </th>
            <th scope="col">Materials Project ID</th>
          </tr>
        </thead>
        <tbody id="phase-table-body">
          <!-- Phase data will be inserted here -->
        </tbody>
      </table>
    </div>
  </div>
</div>
