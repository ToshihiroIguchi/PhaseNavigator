<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Phase Navigator{% endblock %}</title>
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  
  <!-- plotly.js bundled with the Python plotly package (served locally) -->
  <script src="/vendor/plotly.min.js?v={{ plotly_js_version }}"></script>
  
  <!-- CSS -->
  <link rel="stylesheet" href="/static/css/main.css">
  <link rel="stylesheet" href="/static/css/components.css">
  
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% block content %}{% endblock %}
  
  <!-- JavaScript -->
  <script src="/static/js/utils.js?v=1.0.4"></script>
  <script src="/static/js/api.js?v=1.0.2"></script>
  <script src="/static/js/ui.js?v=1.0.5"></script>
  
  {% block extra_js %}{% endblock %}
</body>
</html>
