<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Phase Navigator{% endblock %}</title>
  <link rel="icon" type="image/x-icon" href="{{ static_prefix }}/favicon.ico">
  
  <!-- plotly.js bundled with the Python plotly package (served locally) -->
  <script src="{{ vendor_prefix }}/plotly.min.js?v={{ plotly_js_version }}"></script>
  
  <!-- CSS -->
  <link rel="stylesheet" href="{{ static_prefix }}/css/main.css?v=1.2.0">
  <link rel="stylesheet" href="{{ static_prefix }}/css/components.css?v=1.2.0">
  
  {% block extra_head %}{% endblock %}
</head>
<body{% if static_edition %} data-edition="static"{% endif %}>
  {% block content %}{% endblock %}
  
  <!-- JavaScript -->
  <script src="{{ static_prefix }}/js/utils.js?v=1.0.5"></script>
  <script src="{{ static_prefix }}/js/api.js?v=1.0.3"></script>
  {% if static_edition %}
  <!-- The calculation runs in a Web Worker that loads Pyodide (Python in the browser) from a pinned
       release; the worker checks the integrity hash of the loader script before running it -->
  <script src="{{ static_prefix }}/js/static_engine.js?v=2.0.1"
          data-pyodide-url="{{ pyodide_url }}"
          data-pyodide-sri="{{ pyodide_sri }}"
          data-worker-url="{{ static_prefix }}/js/calc_worker.js?v=1.0.1"></script>
  {% endif %}
  <script src="{{ static_prefix }}/js/ui.js?v=1.0.10"></script>
  
  {% block extra_js %}{% endblock %}
</body>
</html>
